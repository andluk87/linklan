server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'none'" always;
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://api:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
        proxy_send_timeout 30s;
        access_log off;
    }
    location = /admin {
        proxy_pass http://api:8080/admin;
        proxy_set_header X-Real-IP $remote_addr;
        # Admin needs its own CSP (inline styles, external JS).
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }
    location ~ ^/admin\.(js)$ {
        proxy_pass http://api:8080;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }
    location /admin/ {
        proxy_pass http://api:8080;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }
    location = /api/metrics { deny all; }
    location /downloads/ { autoindex off; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
