name: Test and build LinkLAN

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      LINKLAN_TEST_DATABASE: postgres://test:test@localhost:5432/test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - run: go test -mod=vendor -buildvcs=false -count=1 -v ./...
      - run: go vet -mod=vendor -buildvcs=false ./...
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: Read and verify release version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import importlib.util, os
          spec = importlib.util.spec_from_file_location('build_client', 'scripts/build-client.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          version = module.release_version()
          if os.environ['REF_TYPE'] == 'tag' and os.environ['REF_NAME'] != 'v' + version:
              raise SystemExit('Tag must match release-version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
          PY
      - name: Prepare NSIS
        timeout-minutes: 5
        run: |
          if ! command -v makensis >/dev/null; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends nsis || {
              sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
              sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends nsis
            }
          fi
          makensis -VERSION
      - run: python3 scripts/build-client.py --installer
      - run: python3 scripts/publish-downloads.py && python3 scripts/package-update.py
      - name: Collect downloadable artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p artifacts
          cp "releases/LinkLAN-Windows-x64-v${VERSION}.zip" artifacts/
          cp "releases/LinkLAN-Setup-x64-v${VERSION}.exe" artifacts/
          cp "web/downloads/LinkLAN-source-v${VERSION}.zip" artifacts/
          cp "web/downloads/LinkLAN-update-v${VERSION}.zip" artifacts/
          cp releases/latest.json artifacts/
          cd artifacts
          sha256sum *.zip *.exe > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LinkLAN-v${{ steps.version.outputs.version }}
          path: artifacts/
          if-no-files-found: error

  windows-smoke:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LinkLAN-v${{ needs.build.outputs.version }}
          path: artifacts
      - name: Verify installer, uninstall command and installed client
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $installer = Join-Path $PWD "artifacts/LinkLAN-Setup-x64-v$env:VERSION.exe"
          $process = Start-Process -FilePath $installer -ArgumentList '/S' -PassThru
          if (-not $process.WaitForExit(60000) -or $process.ExitCode -ne 0) {
            throw 'Silent installation failed'
          }
          $installDir = Join-Path $env:ProgramFiles 'LinkLAN'
          # NSIS is a 32-bit installer; its uninstall entry uses the 32-bit registry view.
          $entry = Get-ItemProperty 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\LinkLAN'
          $expected = '"' + (Join-Path $installDir 'Uninstall.exe') + '"'
          if ($entry.UninstallString -ne $expected -or $entry.DisplayVersion -ne $env:VERSION) {
            throw 'Installer registry entries do not match the installed release'
          }
          $client = Join-Path $installDir 'LinkLAN.exe'
          $process = Start-Process -FilePath $client -ArgumentList '--self-test' -PassThru
          if (-not $process.WaitForExit(30000) -or $process.ExitCode -ne 0) {
            throw 'Installed client self-test failed'
          }
          $versionOutput = Join-Path $env:RUNNER_TEMP 'linklan-version.txt'
          $process = Start-Process -FilePath $client -ArgumentList '--version' -RedirectStandardOutput $versionOutput -PassThru
          if (-not $process.WaitForExit(30000) -or $process.ExitCode -ne 0) {
            throw 'Installed client version command failed'
          }
          if ((Get-Content $versionOutput -Raw).Trim() -ne $env:VERSION) {
            throw 'Installed EXE version does not match release-version'
          }
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($client)
          if ($info.ProductName -ne 'LinkLAN' -or $info.ProductVersion -ne $env:VERSION) {
            throw 'Windows file properties do not match the release'
          }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($client)
          if ($null -eq $icon) { throw 'Explorer application icon is missing' }
          $icon.Dispose()
          $preview = Start-Process -FilePath $client -ArgumentList '--ui-preview' -PassThru
          try {
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              $preview.Refresh()
              if ($preview.HasExited) { throw 'UI preview exited before opening a window' }
              if ($preview.MainWindowHandle -ne 0) { break }
            }
            if ($preview.MainWindowHandle -eq 0 -or $preview.MainWindowTitle -ne 'LinkLAN') {
              throw 'UI preview did not open the LinkLAN window'
            }
            $null = $preview.CloseMainWindow()
            if (-not $preview.WaitForExit(10000) -or $preview.ExitCode -ne 0) {
              throw 'UI preview did not close cleanly'
            }
          } finally {
            if (-not $preview.HasExited) { Stop-Process -Id $preview.Id }
          }

  release:
    if: github.ref_type == 'tag'
    needs: [build, windows-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LinkLAN-v${{ needs.build.outputs.version }}
          path: artifacts
      - name: Publish versioned files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" artifacts/* --verify-tag --title "LinkLAN $TAG" --generate-notes
