name: linklan
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: linklan
      POSTGRES_USER: linklan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-env.py}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U linklan -d linklan"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes", --requirepass, "${REDIS_PASSWORD:?Run scripts/init-env.py}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]
  api:
    build:
      context: .
      dockerfile: Dockerfile.server
      target: api
    environment:
      DATABASE_URL: postgres://linklan:${POSTGRES_PASSWORD}@postgres:5432/linklan?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Run scripts/init-env.py}
      RELAY_PUBLIC_ADDRESS: ${RELAY_PUBLIC_ADDRESS:-127.0.0.1:51820}
      STUN_PUBLIC_ADDRESS: ${STUN_PUBLIC_ADDRESS:-127.0.0.1:3478}
      TRUST_PROXY: "true"
      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [backend]
  relay:
    build:
      context: .
      dockerfile: Dockerfile.server
      target: relay
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RELAY_COOKIE_SECRET: ${RELAY_COOKIE_SECRET:?Run scripts/init-env.py}
      RELAY_BYTES_PER_SECOND: ${RELAY_BYTES_PER_SECOND:-20971520}
    ports:
      - "${STUN_HOST_PORT:-3478}:3478/udp"
      - "${RELAY_HOST_PORT:-51820}:51820/udp"
    depends_on:
      redis: {condition: service_healthy}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [backend]
  web:
    image: nginx:1.30.5-alpine
    ports: ["8191:80"]
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    restart: unless-stopped
    networks: [backend]
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [monitoring]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=15d]
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped
    networks: [backend]
  grafana:
    image: grafana/grafana:latest
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Run scripts/init-env.py}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/linklan.json:/var/lib/grafana/dashboards/linklan.json:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped
    networks: [backend]
networks:
  backend: {}
volumes:
  postgres-data: {}
  redis-data: {}
  prometheus-data: {}
  grafana-data: {}
